# Seed Data: At most 3 fake rows per table for emulator testing.
# Fake data only - no real member data.

mutation SeedInitialData @auth(level: NO_ACCESS) {
  partner1: partner_insert(
    data: { name: "Campus Cafe", description: "Coffee & snacks" }
  )
  partner2: partner_insert(
    data: { name: "Dev Print Lab", description: "3D printing" }
  )
  partner3: partner_insert(
    data: { name: "NexCafe", description: "Premium beverages" }
  )
  partner4: partner_insert(
    data: { name: "BeanBrew", description: "Specialty coffee" }
  )

  member1: member_insert(
    data: {
      studentId: "S1001"
      email: "member1@astra.local"
      fullName: "Jane Doe"
      isPaid: true
      role: "member"
    }
  )
  member2: member_insert(
    data: {
      studentId: "S1002"
      email: "member2@astra.local"
      fullName: "John Smith"
      isPaid: false
      role: "member"
    }
  )
  member3: member_insert(
    data: {
      studentId: "S1003"
      email: "officer1@astra.local"
      fullName: "Alex Rivera"
      isPaid: true
      role: "officer"
    }
  )

  event1: event_insert(
    data: {
      title: "Orientation Hackathon"
      pointsValue: 15
      eventDate: "2026-11-01T09:00:00Z"
    }
  )
  event2: event_insert(
    data: {
      title: "Cloud Workshop"
      pointsValue: 10
      eventDate: "2026-11-08T13:00:00Z"
    }
  )

  # Perks for voucher seed data
  perk1: perk_insert(
    data: {
      partner: { name: "NexCafe" }
      title: "Free Latte"
      description: "One free latte drink"
      pointsCost: 50
      isActive: true
    }
  )
  perk2: perk_insert(
    data: {
      partner: { name: "BeanBrew" }
      title: "10% Off Any Drink"
      description: "10 percent discount"
      pointsCost: 30
      isActive: true
    }
  )
}

# Seed vouchers separately — run after SeedInitialData so member/perk IDs exist.
# Safe to run repeatedly only if Data Connect supports upsert on code field.
# Active voucher for partner "NexCafe" - code: NEXCAFE-001
# Active voucher for partner "BeanBrew" - code: BEANB-001
# Used voucher - code: USED-001
# Expired voucher - code: EXP-001 (expiresAt in the past)
mutation SeedVouchers @auth(level: NO_ACCESS) {
  v1: voucher_insert(
    data: {
      code: "NEXCAFE-001"
      status: "active"
      isRedeemed: false
      partnerName: "NexCafe"
      expiresAt: "2027-12-31T23:59:59Z"
      member: { studentId: "S1001" }
      perk: { title: "Free Latte" }
    }
  )
  v2: voucher_insert(
    data: {
      code: "BEANB-001"
      status: "active"
      isRedeemed: false
      partnerName: "BeanBrew"
      expiresAt: "2027-12-31T23:59:59Z"
      member: { studentId: "S1002" }
      perk: { title: "10% Off Any Drink" }
    }
  )
  v3: voucher_insert(
    data: {
      code: "USED-001"
      status: "used"
      isRedeemed: true
      redeemedAt: "2026-10-01T10:00:00Z"
      partnerName: "NexCafe"
      member: { studentId: "S1001" }
      perk: { title: "Free Latte" }
    }
  )
  v4: voucher_insert(
    data: {
      code: "EXP-001"
      status: "active"
      isRedeemed: false
      partnerName: "NexCafe"
      expiresAt: "2025-01-01T00:00:00Z"
      member: { studentId: "S1002" }
      perk: { title: "Free Latte" }
    }
  )
}
