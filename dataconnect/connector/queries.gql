# Example query for SDK generation
query ListEvents @auth(level: PUBLIC) {
  events {
    id
    title
    description
    pointsValue
    eventDate
  }
}

# Get all attendance records for a specific event (officer/admin use)
query GetEventAttendance($eventId: String!) @auth(level: PUBLIC) {
  attendances(where: { event: { id: { eq: $eventId } } }) {
    id
    srCode: member {
      studentId
      fullName
    }
    checkInAt
  }
}

# Look up a voucher by its code for partner validation
query GetVoucherByCode($code: String!) @auth(level: PUBLIC) {
  vouchers(where: { code: { eq: $code } }) {
    id
    code
    status
    isRedeemed
    redeemedAt
    expiresAt
    partnerName
    perk {
      title
      pointsCost
      partner {
        name
      }
    }
  }
}

# Check if member already attended an event (uniqueness guard)
query GetAttendanceByMemberEvent($studentId: String!, $eventId: String!)
@auth(level: PUBLIC) {
  attendances(
    where: {
      member: { studentId: { eq: $studentId } }
      event: { id: { eq: $eventId } }
    }
  ) {
    id
    checkInAt
  }
}

